<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEAM BEBETO</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Cairo',sans-serif;background:#0f172a;color:#fff}
header{
background:#181818;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:999;
}
.hero{
height:420px;
background:url("img/cover.png") center/cover;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}
.hero::before{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.45);
} 
.hero h1{
position:relative;
font-size:45px;
font-weight:800;
} 
.socials{
display:flex;
align-items:center;
gap:12px;
}

.socials a{
color:#fff;
font-size:22px;
text-decoration:none;
transition:.3s;
}

.socials a:hover{
color:#ef4444;
transform:scale(1.15);
} 

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;padding:20px}
.card{
    background:#1e293b;
    border-radius:16px;
    overflow:hidden;
    transition:.3s;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    position:relative;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 35px rgba(0,0,0,.45);
}
.card img{
width:100%;
height:320px;
object-fit:cover;
cursor:pointer;
transition:.4s;
}

.card:hover img{
transform:scale(1.08);
}
.info{
padding:15px;
text-align:center;
}

.info h3{
margin:0;
font-size:20px;
font-weight:700;
}

.info p{
margin:10px 0;
font-size:22px;
font-weight:800;
color:#22c55e;
}
button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#ef4444;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#dc2626;
transform:scale(1.03);
}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center}
.box{
background:#1e293b;
padding:20px;
border-radius:20px;
width:90%;
max-width:450px;
box-shadow:0 20px 50px rgba(0,0,0,.5);
animation:popup .3s;
}

@keyframes popup{
from{
transform:scale(.8);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}
.box img{
width:100%;
height:350px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
}
select,
input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
margin-top:5px;
margin-bottom:15px;
font-size:16px;
background:#0f172a;
color:white;
}
button:hover{
background:#dc2626;
}
.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo img{
width:45px;
height:45px;
object-fit:contain;
} 
.badge{
position:absolute;
top:12px;
left:12px;
background:#ef4444;
color:#fff;
padding:5px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
} 
.actions{
display:flex;
gap:10px;
}

.actions button{
flex:1;
}

.close{
background:#475569;
}

.close:hover{
background:#334155;
} 
#mprice{
font-size:24px;
font-weight:bold;
color:#22c55e;
margin:10px 0 20px;
}
.cart-icon{
position:relative;
cursor:pointer;
font-size:26px;
}

#count{
position:absolute;
top:-8px;
left:-10px;
background:#ef4444;
width:22px;
height:22px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
} 
.cartModal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
z-index:9999;
}

.cartBox{
background:#1e293b;
padding:20px;
width:95%;
max-width:500px;
border-radius:20px;
max-height:80vh;
overflow:auto;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
border-bottom:1px solid #333;
}

.item button{
width:auto;
padding:6px 12px;
} 
textarea{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#0f172a;
color:#fff;
margin-bottom:15px;
resize:vertical;
min-height:90px;
font-family:'Cairo',sans-serif;
}
.search-box{
    padding:20px;
    display:flex;
    justify-content:center;
}

.search-box input{
    width:100%;
    max-width:500px;
    padding:15px;
    border:none;
    border-radius:50px;
    background:#1e293b;
    color:#fff;
    font-size:17px;
    outline:none;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.search-box input::placeholder{
    color:#94a3b8;
} 
.cart-image{
width:70px;
height:70px;
border-radius:10px;
object-fit:cover;
margin-left:10px;
}

.item-info{
flex:1;
line-height:1.8;
} 
@media (max-width:768px){

.hero{
height:220px;
}

.hero h1{
font-size:28px;
text-align:center;
padding:0 15px;
}

.grid{
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:12px;
}

.card img{
height:220px;
}

.info h3{
font-size:15px;
}

.info p{
font-size:18px;
}

button{
padding:10px;
font-size:14px;
}

.box{
width:95%;
padding:15px;
}
.box{
overflow-y:auto;
max-height:90vh;
} 
.box img{
height:250px;
}

}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<header>
	<div class="socials">

<a href="https://wa.me/201094634045" target="_blank">
<i class="fab fa-whatsapp"></i>
</a>

<a href="https://www.facebook.com/share/1E8aa4yUZL/?mibextid=wwXIfr" target="_blank">
<i class="fab fa-facebook"></i>
</a>

<a href="https://instagram.com/official_teambebeto" target="_blank">
<i class="fab fa-instagram"></i>
</a>

<a href="https://tiktok.com/@official_teambebeto" target="_blank">
<i class="fab fa-tiktok"></i>
</a>

</div>
<div class="logo">
<img src="img/logob.png">
<h2>TEAM BEBETO</h2>
</div>
<div class="cart-icon" onclick="openCart()">
🛒
<span id="count">0</span>
</div>

</header>
<div class="hero">

</div>
<div class="search-box">
    <input type="text" id="search" placeholder="🔍 ابحث عن فريق أو منتج..." onkeyup="searchProducts()">
</div>
<div class="grid" id="products"></div>
<div id="modal"><div class="box">
<img id="mimg">
<h3 id="mname"></h3>
<p id="mprice"></p>
<label>اللون</label><select id="color"><option>أبيض</option><option>أسود</option><option>أحمر</option><option>أزرق</option></select><br><br>
<label>المقاس</label><select id="size"><option>S</option><option>M</option><option>L</option><option>XL</option></select><br><br>
<label>الكمية</label><input id="qty" type="number" value="1" min="1"><br><br>
<div class="actions">
<button onclick="addCart()">🛒 إضافة للسلة</button>
<button class="close" onclick="modal.style.display='none'">إغلاق</button>
</div>
</div></div>
<div id="cartModal" class="cartModal">

<div class="cartBox">

<h2>🛒 سلة المشتريات</h2>

<div id="cartItems"></div>

<h3 id="total">الإجمالي : 0 جنيه</h3>



<input type="text" id="customerName" placeholder="الاسم">

<input type="tel" id="customerPhone" placeholder="رقم الهاتف">

<input type="text" id="customerAddress" placeholder="العنوان">

<textarea id="customerNote" placeholder="ملاحظات (اختياري)"></textarea>

<button onclick="checkout()">
إتمام الطلب
</button>

<button onclick="closeCart()" class="close">
إغلاق
</button>

</div>

</div>
<script>
const phone="+201094634045";
const data = [
{
name:"  طقم كامل 3 قطع",
price:950,
img:"img/realmadrid.jpg"
},
{
name:" تيشيرت ",
price:920,
img:"img/barcelona.jpg"
},
{
name:"شورت ",
price:900,
img:"img/liverpool.jpg"
}
];
let current=0,cart=[];
function renderProducts(list){

products.innerHTML=list.map((p)=>`
<div class="card">

<div class="badge">جديد</div>

<img src="${p.img}" onclick="show(${data.indexOf(p)})">

<div class="info">

<h3>${p.name}</h3>

<p>${p.price} جنيه</p>

<button onclick="show(${data.indexOf(p)})">
اختر المنتج
</button>

</div>

</div>
`).join("");

}
renderProducts(data);


function show(i){
current=i;
mimg.src=data[i].img;
mname.textContent=data[i].name;
mprice.textContent=data[i].price+" جنيه";
qty.value=1;
modal.style.display="flex";
}
function searchProducts(){

let value=search.value.toLowerCase();

let result=data.filter(function(p){

return p.name.toLowerCase().includes(value);

});

renderProducts(result);

}
function addCart(){

cart.push({
n:data[current].name,
p:data[current].price,
c:color.value,
s:size.value,
q:Number(qty.value)
});

count.textContent=cart.length;

modal.style.display="none";

alert("✅ تمت إضافة المنتج إلى السلة");

}

function openCart(){

cartModal.style.display="flex";

let html="";

let total=0;

cart.forEach((x,i)=>{

total+=x.p*x.q;

html+=`
<div class="item">

<img src="${data.find(p=>p.name===x.n).img}" class="cart-image">

<div class="item-info">

<b>${x.n}</b><br>

اللون: ${x.c}<br>

المقاس: ${x.s}<br>

الكمية: ${x.q}<br>

${x.p} جنيه

</div>

<button onclick="removeItem(${i})">🗑</button>

</div>
`;

});

cartItems.innerHTML=html;

document.getElementById("total").innerHTML="الإجمالي : "+total+" جنيه";

}

function closeCart(){

cartModal.style.display="none";

}

function removeItem(i){

cart.splice(i,1);

count.textContent=cart.length;

openCart();

}
function checkout(){

if(cart.length==0){
alert("السلة فارغة");
return;
}

let name=document.getElementById("customerName").value.trim();
let phoneNumber=document.getElementById("customerPhone").value.trim();
let address=document.getElementById("customerAddress").value.trim();
let note=document.getElementById("customerNote").value.trim();

if(name=="" || phoneNumber=="" || address==""){
alert("من فضلك أكمل البيانات");
return;
}

let total=0;

let msg="🛍️ طلب جديد%0A%0A";

msg+="👤 الاسم: "+name+"%0A";
msg+="📞 الهاتف: "+phoneNumber+"%0A";
msg+="📍 العنوان: "+address+"%0A";

if(note!=""){
msg+="📝 ملاحظات: "+note+"%0A";
}

msg+="%0A--------------------%0A";

cart.forEach(function(x){

total+=x.p*x.q;

msg+=
x.n+
"%0Aاللون: "+x.c+
"%0Aالمقاس: "+x.s+
"%0Aالكمية: "+x.q+
"%0Aالسعر: "+x.p+
"%0A--------------------%0A";

});

msg+="💰 الإجمالي: "+total+" جنيه";

window.open(
"https://wa.me/"+phone+"?text="+msg,
"_blank"
);

}
</script></body></html>
